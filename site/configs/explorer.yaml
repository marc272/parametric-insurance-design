# The site's explorer bundle (MAR-208): built in CI by the Site workflow
# (.github/workflows/site.yml), never committed. It is the bundle the payout
# explorer (MAR-54) reads: the alpha, beta and budget-loading (kappa) sweeps
# of the three objectives, out of sample, on the annual basis (the
# publication rule, AGENTS.md).
#
# The setup is checkpoint C1's main line (research/configs/c1/c1_main.yaml):
# the thesis portfolio (9 Miami locations), the thesis noise layer, the
# annual basis, a holdout split (first 70 % of the 10,000 simulated years
# train, the last 30 % test), pure pricing, budget loading 1.0, 15 bins from
# 20 to 70 m/s, evaluation beta 0.99, and the weighted-CVaR objective at
# alpha 0.9, beta 0.99.
#
# Reductions against C1, so that the Site workflow solves it in a few minutes
# on a GitHub runner (the bundle's label states them too):
#   1. One scope, individual: each location calibrated on its own. No cluster
#      or portfolio scope, so the bundle makes no joint-calibration
#      statement (the RQ2 rule).
#   2. No bootstrap section: point values only, no confidence intervals
#      (C1 has B = 1000; it would about double the solve time).
#   3. Coarse sweep grids, one factor at a time around the baseline:
#      alpha 6 values (C1 / thesis: 10), beta 5 values (C1: 0.95 ... 0.995),
#      kappa 5 values (thesis: 11, 0.5 to 1.5 by 0.1). No n_bins sweep.
#
# The description below is the bundle's label (export-site's default): it
# names the setup and every reduction, and says which rows may be published.
# A holdout run stores KPIs and exceedance curves on the train years
# (eval_split "train", in sample) and on the test years ("test", out of
# sample); a published page shows the "test" rows only.
#
# Build it from the repository root (the workflow runs the same commands):
#   uv run parametric-insurance-design sweep site/configs/explorer.yaml --jobs 4
#   quarto render site
#   uv run parametric-insurance-design export-site site/configs/explorer.yaml \
#       --out site/_site/bundles/explorer
# Relative paths are relative to this file's directory.
schema_version: 1
name: site-explorer
description: >-
  Site explorer bundle (MAR-208), built in CI from site/configs/explorer.yaml on
  the thesis parity event set. Setup - the thesis portfolio (9 Miami locations),
  thesis noise layer, annual basis, holdout split (years 0-6999 train, 7000-9999
  test), pure pricing, budget loading 1.0, 15 bins from 20 to 70 m/s, evaluation
  beta 0.99; objectives MSE, E[U] and weighted CVaR (alpha 0.9, beta 0.99).
  Reduced for CI - individual scope only, no bootstrap intervals, coarse sweeps
  (alpha 6 values, beta 5, budget loading 5). Out-of-sample numbers are the
  eval_split "test" rows; the "train" rows are in sample and are not to be
  published.
eventset:
  path: ../../parity/tests/data/thesis_eventset
  checksum: sha256:404b0c3a3aefa38965ad3ace2747d308685a67e3b218cb835d45a9ab375294df
portfolio:
  location_ids: [A1, A2, A3, A4, A5, A6, A7, A8, A9]
noise:
  kind: heteroscedastic
  level: 0.3
  n_copies: 13
  seed: 42
  bounds: [20.0, 70.0]
threshold:
  value: 20.0
  column: index
basis: annual
sample:
  kind: holdout
  train_fraction: 0.7
payout:
  kind: step
  attachment: 20.0
  limit: 70.0
  n_bins: 15
scopes:
- kind: individual
objectives:
- kind: mse
- kind: expected_uncovered
- kind: weighted_cvar
  alpha: 0.9
  beta: 0.99
pricing:
  kind: pure
constraints:
- kind: budget
  loading: 1.0
evaluation:
  beta: 0.99
sweeps:
- parameter: alpha
  values: [0.1, 0.3, 0.5, 0.7, 0.9, 1.0]
- parameter: beta
  values: [0.95, 0.97, 0.98, 0.99, 0.995]
- parameter: budget_loading
  values: [0.5, 0.75, 1.0, 1.25, 1.5]
output:
  directory: ../../results/site/explorer
