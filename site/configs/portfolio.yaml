# The site's portfolio bundle: built in CI by the Site workflow
# (.github/workflows/site.yml), never committed. It is the bundle the
# portfolio explorer (site/explorers/portfolio.qmd) reads: one joint design
# of the owner's whole portfolio (portfolio scope, and the cluster scope)
# next to the sum of the individual designs of the same sites, at the same
# total budget, out of sample, on the annual basis (the publication rule,
# AGENTS.md).
#
# The setup is that of the explorer bundle (site/configs/explorer.yaml) and
# of checkpoint C1's main line (research/configs/c1/c1_main.yaml): the thesis
# portfolio (9 Miami locations), the thesis noise layer, the annual basis, a
# holdout split (first 70 % of the 10,000 simulated years train, the last
# 30 % test), pure pricing, budget loading 1.0, 15 bins from 20 to 70 m/s,
# evaluation beta 0.99, and the weighted-CVaR objective at alpha 0.9, beta
# 0.99, with block-bootstrap intervals (seed 0, level 0.9).
#
# Four scopes, each with the three objectives (12 runs, no sweeps):
#   1. individual: each site calibrated on its own, with its own budget,
#      kappa times its expected loss. The owner's cover is the sum of the
#      nine individual covers.
#   2. cluster (joint, C1's clustering: 3 clusters, thesis Ward clustering,
#      tail level 0.9): one payout function per cluster on the cluster's
#      value-weighted index, calibrated jointly, one budget on the total.
#   3. cluster with joint: false: the same clusters and cluster index, each
#      cluster calibrated on its own with its own budget. Against the
#      individual scope it changes only the index; against the joint cluster
#      scope only the calibration (docs/concepts/portfolio-calibration.md).
#   4. portfolio: one payout function per site on its own index, calibrated
#      jointly, one budget on the total.
# The four budgets add up to the same total, kappa times the expected total
# loss on the calibration years.
#
# Reductions against C1, so that the Site workflow solves it in a few minutes
# on a GitHub runner (the bundle's label states them too): bootstrap
# B = 200, not C1's 1000. No sweeps.
#
# No allocation rule (evaluation.allocation is left at none): the bundle's
# per-site numbers (baseline.map.arrow) are those of the individual scope
# only. A joint design fixes only the owner's total, so its per-site split is
# not identified and is never exported as per-site cover
# (docs/methodology/payout-allocation.md).
#
# Out of sample only. A holdout run stores KPIs and exceedance curves on the
# train years (eval_split "train", in sample) and on the test years ("test",
# out of sample). The bundle is exported with --split test, so its kpis,
# exceedance and map files hold the "test" rows only; the manifest records
# the filter (split_filter). The payout tables have no split.
#
# The description below is the bundle's label (export-site's default): it
# names the setup and every reduction.
#
# Build it from the repository root (the workflow runs the same commands):
#   uv run parametric-insurance-design run site/configs/portfolio.yaml --jobs 4
#   quarto render site
#   uv run parametric-insurance-design export-site site/configs/portfolio.yaml \
#       --no-sweeps --split test --out site/_site/bundles/portfolio
# Relative paths are relative to this file's directory.
schema_version: 1
name: site-portfolio
description: >-
  Site portfolio bundle, built in CI from site/configs/portfolio.yaml on the
  thesis parity event set. Setup - the thesis portfolio (9 Miami locations),
  thesis noise layer, annual basis, holdout split (years 0-6999 train, 7000-9999
  test), pure pricing, budget loading 1.0, 15 bins from 20 to 70 m/s, evaluation
  beta 0.99; objectives MSE, E[U] and weighted CVaR (alpha 0.9, beta 0.99);
  scopes individual, cluster (3 clusters, thesis Ward clustering, tail level
  0.9; calibrated jointly, and cluster by cluster) and portfolio. The four
  scopes have the same total budget. Block-bootstrap intervals, level 0.9.
  Reduced for CI - bootstrap B = 200 (C1 1000), no sweeps. Out of sample only -
  the KPIs, exceedance curves and map numbers are those of the test years
  (eval_split "test"); the in-sample "train" rows are not in the bundle.
eventset:
  path: ../../parity/tests/data/thesis_eventset
  checksum: sha256:404b0c3a3aefa38965ad3ace2747d308685a67e3b218cb835d45a9ab375294df
portfolio:
  location_ids: [A1, A2, A3, A4, A5, A6, A7, A8, A9]
noise:
  kind: heteroscedastic
  level: 0.3
  n_copies: 13
  seed: 42
  bounds: [20.0, 70.0]
threshold:
  value: 20.0
  column: index
basis: annual
sample:
  kind: holdout
  train_fraction: 0.7
payout:
  kind: step
  attachment: 20.0
  limit: 70.0
  n_bins: 15
scopes:
- kind: individual
- kind: cluster
  n_clusters: 3
  strategy:
    kind: thesis_ward
    beta_tail: 0.9
    linkage: ward
- kind: cluster
  n_clusters: 3
  joint: false
  strategy:
    kind: thesis_ward
    beta_tail: 0.9
    linkage: ward
- kind: portfolio
objectives:
- kind: mse
- kind: expected_uncovered
- kind: weighted_cvar
  alpha: 0.9
  beta: 0.99
pricing:
  kind: pure
constraints:
- kind: budget
  loading: 1.0
evaluation:
  beta: 0.99
bootstrap:
  seed: 0
  n_bootstrap: 200
  level: 0.9
sweeps: []
output:
  directory: ../../results/site/portfolio
