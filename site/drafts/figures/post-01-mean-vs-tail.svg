<title id="t">Average shortfall versus tail shortfall</title>
<desc id="d">Schematic right-skewed distribution of the annual uncovered loss. A dashed line marks the average, E[U], in the body of the distribution. The worst share of years, beyond the value-at-risk, is shaded; a second dashed line marks CVaR, the average uncovered loss over that shaded tail. Not model output.</desc>
