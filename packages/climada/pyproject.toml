# Not a uv workspace member: this package has its own pixi env with CLIMADA
# from conda-forge (SPEC §4.1), defined in pixi.toml next to this file, with
# the core installed from ../core. It must never depend on or import
# parametric-insurance-design-crc.

[project]
name = "parametric-insurance-design-climada"
version = "0.1.0.dev0"
description = "CLIMADA adapter for parametric-insurance-design: tracks to CLIMADA hazards and impacts to an EventSet."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Marc Prinzing" }]
requires-python = ">=3.11"
# climada: the pixi env pins the exact version (pixi.toml).
dependencies = ["climada>=6.1,<7", "parametric-insurance-design"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/marc272/parametric-insurance-design"

# Run with `pixi run test` from this folder. This table makes the package's
# test config independent of the uv workspace's root config.
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
strict = true

# --- ruff: import boundaries (AGENTS.md "Hard boundaries") ------------------
# This [tool.ruff] table makes ruff use this file, which extends the root
# config, for every file under packages/climada/ (src, tests and scripts).
# TID251 bans any static import, at any scope, of the package below. This
# package is not a uv member, but the root `ruff check` (CI job lint, and
# scripts/ci_local.sh lint) lints it with this config.
# scripts/check_import_boundaries.sh (CI, job lint) proves the ban fires.
[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"parametric_insurance_design_crc".msg = "the CLIMADA stream is CRC-free: never import the CRC adapter (AGENTS.md \"Hard boundaries\")"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
