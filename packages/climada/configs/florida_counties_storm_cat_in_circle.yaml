# Hazard-model scenario S_1 (SPEC §6.5 (i), D7, MAR-32), index (b) variant:
# every setting is configs/florida_counties_storm.yaml's except the index, the
# cat-in-a-circle (MAR-26) around each county's value-weighted centroid: the
# maximum Saffir-Simpson category of the track within 50 km, as in
# configs/florida_counties_cat_in_circle.yaml (IRIS). STORM's 10-minute wind
# is converted to 1-minute (divided by 0.88) before the category is taken.
# Rows and losses equal those of florida_counties_storm.yaml.
#
#   pixi run build-eventset --config configs/florida_counties_storm_cat_in_circle.yaml
#
# Paths are relative to this file; see configs/florida_counties_storm.yaml.
catalogue: ../../../data/storm/raw/STORM_v4
tracks:
  kind: storm
  basin: NA
n_years: 10000
locations:
  yaml: ../../../data/litpop-florida/locations/locations.yaml
proximity_km: 500
batch_size: 100
wind:
  model: H08
  intensity_thres: 17.5
  max_dist_eye_km: 300
  max_latitude: 61
  max_dist_inland_km: null
impact_function:
  kind: emanuel_usa
  impf_id: 1
  v_thresh: 25.7
  v_half: 74.7
  scale: 1.0
index:
  kind: cat_in_circle
  radius_km: 50
  metric: category
  breakpoints_kn: [64, 83, 96, 113, 137]
  track_step_hours: 0.5
vulnerability:
  kind: none
loss:
  kind: cells
  cells: ../../../data/litpop-florida/locations/cells.parquet
  unit: USD (LitPop reference_year 2018)
hazard_release: "STORM IBTrACS present climate synthetic tropical cyclone tracks, version 4 (2022), 4TU.ResearchData, doi:10.4121/12706085.v4, basin NA, files STORM_DATA_IBTRACS_NA_1000_YEARS_0.txt to _9.txt (10,000 years); 10-minute winds converted to 1-minute (divided by 0.88)"
scenario_id: storm-present-climate
scenario_notes:
  - "Hazard-model scenario (SPEC §6.5 (i), D7): the same locations, wind field, impact function and loss path as the IRIS reference florida_counties_no_draws.yaml; only the track catalogue differs."
  - "Value unit: USD (LitPop reference_year 2018); produced capital scaled from 2014 constant USD by CLIMADA, see research/notes/d2-florida-litpop-locations.md."
  - "Locations: Florida's 67 counties (location_id = county GEOID), each the sum of its LitPop cells and located at the cells' value-weighted centroid; the State of Florida is the single risk owner (D2, SPEC §6.6)."
  - "Attribution: asset values from the CLIMADA data API, dataset LitPop_150arcsec_USA v3 (uuid 678e9551-32ca-40f3-9881-9bd38412c1cd), CC BY 4.0, Eberenz et al. (2020), Earth Syst. Sci. Data 12, 817-833, doi:10.5194/essd-12-817-2020, archive doi:10.3929/ethz-b-000331316; county boundaries: U.S. Census Bureau, 2025 TIGER/Line Shapefiles; hazard: STORM (Bloemendaal et al. 2020, Sci. Data 7, 40, doi:10.1038/s41597-020-0381-2), dataset doi:10.4121/12706085.v4, CC0 1.0."
# The stricter of STORM's CC0 1.0 and LitPop's CC BY 4.0.
licence: CC-BY-4.0
output: ../../../data/eventsets/florida-counties-storm-cat-in-circle-50km
