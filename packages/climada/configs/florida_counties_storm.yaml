# Hazard-model scenario S_1 of the robust design (SPEC §6.5 (i), D7, MAR-32):
# the paper portfolio (Florida's 67 counties, D2) on STORM instead of IRIS.
# STORM IBTrACS present climate synthetic tropical cyclone tracks, version 4,
# North Atlantic, 10 files x 1,000 years (4TU.ResearchData,
# doi:10.4121/12706085, CC0 1.0). Every other setting is
# configs/florida_counties_no_draws.yaml's (the IRIS reference S_0 without
# draws), so the two scenarios differ only in the tracks: index (a) wind at
# each county's value-weighted centroid, per-cell loss, the base Emanuel
# impact function and no vulnerability draws (the deterministic base
# function; the draws prior is still open, MAR-118 Q1).
#
# The STORM reader (storm.py) rebuilds the simulation year as
# 1000 * file index + year in file and divides the 10-minute wind by 0.88.
# `catalogue` is the directory holding STORM_DATA_IBTRACS_NA_1000_YEARS_0.txt
# ... _9.txt. Its download script and checksum manifest follow once the 4TU
# host can be reached (MAR-32 PR note); until then, place the ten files there
# by hand. Each file's SHA256 is recorded in the EventSet's source_checksums.
#
#   pixi run florida-locations    # once: locations.yaml and cells.parquet
#   pixi run build-eventset --config configs/florida_counties_storm.yaml
#
# Paths are relative to this file. Inputs and output live under the
# git-ignored data/ at the repository root.
catalogue: ../../../data/storm/raw/STORM_v4
tracks:
  kind: storm
  basin: NA
n_years: 10000
locations:
  yaml: ../../../data/litpop-florida/locations/locations.yaml
proximity_km: 500
batch_size: 100
wind:
  model: H08
  intensity_thres: 17.5
  max_dist_eye_km: 300
  max_latitude: 61
  max_dist_inland_km: null
impact_function:
  kind: emanuel_usa
  impf_id: 1
  v_thresh: 25.7
  v_half: 74.7
  scale: 1.0
index:
  kind: centroid_wind
vulnerability:
  kind: none
loss:
  kind: cells
  cells: ../../../data/litpop-florida/locations/cells.parquet
  unit: USD (LitPop reference_year 2018)
hazard_release: "STORM IBTrACS present climate synthetic tropical cyclone tracks, version 4 (2022), 4TU.ResearchData, doi:10.4121/12706085.v4, basin NA, files STORM_DATA_IBTRACS_NA_1000_YEARS_0.txt to _9.txt (10,000 years); 10-minute winds converted to 1-minute (divided by 0.88)"
scenario_id: storm-present-climate
scenario_notes:
  - "Hazard-model scenario (SPEC §6.5 (i), D7): the same locations, wind field, impact function and loss path as the IRIS reference florida_counties_no_draws.yaml; only the track catalogue differs."
  - "Value unit: USD (LitPop reference_year 2018); produced capital scaled from 2014 constant USD by CLIMADA, see research/notes/d2-florida-litpop-locations.md."
  - "Locations: Florida's 67 counties (location_id = county GEOID), each the sum of its LitPop cells and located at the cells' value-weighted centroid; the State of Florida is the single risk owner (D2, SPEC §6.6)."
  - "Attribution: asset values from the CLIMADA data API, dataset LitPop_150arcsec_USA v3 (uuid 678e9551-32ca-40f3-9881-9bd38412c1cd), CC BY 4.0, Eberenz et al. (2020), Earth Syst. Sci. Data 12, 817-833, doi:10.5194/essd-12-817-2020, archive doi:10.3929/ethz-b-000331316; county boundaries: U.S. Census Bureau, 2025 TIGER/Line Shapefiles; hazard: STORM (Bloemendaal et al. 2020, Sci. Data 7, 40, doi:10.1038/s41597-020-0381-2), dataset doi:10.4121/12706085.v4, CC0 1.0."
# The stricter of STORM's CC0 1.0 and LitPop's CC BY 4.0.
licence: CC-BY-4.0
output: ../../../data/eventsets/florida-counties-storm
