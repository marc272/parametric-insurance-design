# EventSet for the thesis portfolio (9 Miami assets) from the IRIS North
# Atlantic 10,000-year catalogue: the thesis src/CLIMADA/engine.py as a config.
#
#   pixi run iris                                    # once: download + merge IRIS
#   pixi run build-eventset --config configs/thesis.yaml
#
# Paths are relative to this file. The catalogue and the output live under the
# git-ignored data/ at the repository root; nothing here is committed data.
catalogue: ../../../data/iris/transformed/IRIS_NA_10000Y_merged.txt
n_years: 10000            # IRIS years 0-9,999 (IRIS README); rate = 1/10,000
locations:
  # The thesis assets (configs/experiment_config.yaml), as converted into the
  # parity fixture by MAR-9.
  eventset: ../../../parity/tests/data/thesis_eventset
proximity_km: 500         # thesis PROXIMITY_KM
batch_size: 500           # thesis BATCH_SIZE (memory only; no effect on data)
wind:
  model: H08              # CLIMADA default, as in the thesis
  intensity_thres: 17.5
  max_dist_eye_km: 300
  max_latitude: 61
  # The thesis used CLIMADA's default 1000 km inland cut-off; all nine assets
  # are coastal, so ignoring the distance to the coast gives the same wind
  # without CLIMADA's own 300 MB distance-to-coast download.
  max_dist_inland_km: null
impact_function:
  kind: emanuel_usa       # ImpfTropCyclone.from_emanuel_usa, thesis choice
  impf_id: 1
  v_thresh: 25.7
  v_half: 74.7
  scale: 1.0
scenario_id: iris-present-climate
# Written as the parity fixture does; the IRIS licence record is open (MAR-94).
licence: CC0-1.0
output: ../../../data/eventsets/thesis-iris
