# The paper's main EventSet (D2, SPEC §6.6; MAR-114): Florida's 67 counties
# from LitPop (MAR-113), IRIS North Atlantic 10,000 years, index (a) wind at
# each county's value-weighted centroid, and vulnerability uncertainty in the
# loss (MAR-25: Emanuel v_half drawn from Eberenz et al. 2021, region NA2,
# wind-only North Atlantic events, the MAR-103 and MAR-132 defaults, recentred
# on the base function's v_half 74.7: MAR-118 Q5, MAR-160). Monroe
# County's LitPop gap (Key West and the Lower Keys have no cell) is stated in
# the scenario notes (MAR-132). A county's loss is the sum of the
# impacts on its LitPop cells (loss: cells), not the impact at its centroid.
# The cat-in-a-circle variant is configs/florida_counties_cat_in_circle.yaml.
#
#   pixi run iris                 # once: download + merge IRIS
#   pixi run florida-locations    # once: locations.yaml and cells.parquet
#   pixi run build-eventset --config configs/florida_counties.yaml
#
# Paths are relative to this file. The inputs and the output live under the
# git-ignored data/ at the repository root; checksums, the metadata and the
# config hashes are committed in research/data/d2-florida-eventset/.
catalogue: ../../../data/iris/transformed/IRIS_NA_10000Y_merged.txt
n_years: 10000
locations:
  yaml: ../../../data/litpop-florida/locations/locations.yaml
proximity_km: 500
# Batches of 100 storms keep the per-cell draws (10 x 100 x 7,817 floats per
# batch) small; batch_size does not change the data.
batch_size: 100
wind:
  model: H08
  intensity_thres: 17.5
  max_dist_eye_km: 300
  max_latitude: 61
  max_dist_inland_km: null
impact_function:
  kind: emanuel_usa
  impf_id: 1
  v_thresh: 25.7
  v_half: 74.7
  scale: 1.0
index:
  kind: centroid_wind
vulnerability:
  kind: emanuel_v_half
  n_draws: 10
  seed: 20261027
  prior:
    kind: eberenz2021_edr
    region: NA2
    wind_only: true
    basins: [NA]   # MAR-132 default: North Atlantic events only (17 NA2 events)
    recentre: median  # MAR-160: median v_half = impact_function.v_half (74.7)
loss:
  kind: cells
  cells: ../../../data/litpop-florida/locations/cells.parquet
  unit: USD (LitPop reference_year 2018)
scenario_id: iris-present-climate
scenario_notes:
  - "Value unit: USD (LitPop reference_year 2018); produced capital scaled from 2014 constant USD by CLIMADA, see research/notes/d2-florida-litpop-locations.md."
  - "Locations: Florida's 67 counties (location_id = county GEOID), each the sum of its LitPop cells and located at the cells' value-weighted centroid; the State of Florida is the single risk owner (D2, SPEC §6.6)."
  - "Attribution: asset values from the CLIMADA data API, dataset LitPop_150arcsec_USA v3 (uuid 678e9551-32ca-40f3-9881-9bd38412c1cd), CC BY 4.0, Eberenz et al. (2020), Earth Syst. Sci. Data 12, 817-833, doi:10.5194/essd-12-817-2020, archive doi:10.3929/ethz-b-000331316; county boundaries: U.S. Census Bureau, 2025 TIGER/Line Shapefiles; hazard: IRIS (Sparks and Toumi 2024), data descriptor doi:10.1038/s41597-024-03250-y, collection doi:10.6084/m9.figshare.c.6724251.v1."
  - "Monroe County (the Florida Keys, GEOID 12087) is in the portfolio with a known exposure gap: the LitPop_150arcsec_USA grid has no cell centred west of 81.604 deg W in the Keys, so Key West and the Lower Keys west of it carry no asset value (LitPop's land mask at 150 arcsec leaves them out; they have no cell at all, not a zero-valued one). Monroe's value (0.765e9 USD, 0.016 % of the 4.893e12 USD portfolio) and its losses are therefore understated; the gap is not filled from another source (MAR-132; owner decision on MAR-118)."
licence: CC-BY-4.0
output: ../../../data/eventsets/florida-counties-iris-vulnerability
