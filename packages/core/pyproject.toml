[project]
name = "parametric-insurance-design"
version = "0.1.0.dev0"
description = "Design of parametric insurance payout functions with tail-risk objectives, per asset or across a portfolio."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Marc Prinzing" }]
requires-python = ">=3.11"
dependencies = [
    "cvxpy>=1.6",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pydantic>=2.7",
    "pyyaml>=6.0.1",
    "scipy>=1.15.2",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/marc272/parametric-insurance-design"

[project.scripts]
parametric-insurance-design = "parametric_insurance_design.cli:main"

# --- ruff: import boundaries (ADR 0001, AGENTS.md "Hard boundaries") --------
# This [tool.ruff] table makes ruff use this file, which extends the root
# config, for every file under packages/core/ (src and tests). TID251 bans any
# static import, at any scope, of the packages below. The figures command's
# lazy importlib.import_module of the viz command (cli._import_viz) names the
# module in a string, which ruff does not see: it is the one sanctioned route
# from the core to viz, so that the core installs and runs without viz.
# scripts/check_import_boundaries.sh (CI, job lint) proves the bans fire.
[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"parametric_insurance_design_viz".msg = "core never imports viz statically; only cli._import_viz reaches it, via importlib (AGENTS.md \"Hard boundaries\")"
"parametric_insurance_design_crc".msg = "core never imports the AGPL CRC adapter (ADR 0001; AGENTS.md \"Hard boundaries\")"
"parametric_insurance_design_climada".msg = "core never imports the GPL CLIMADA adapter (ADR 0001; AGENTS.md \"Hard boundaries\")"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
