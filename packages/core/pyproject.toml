[project]
name = "parametric-insurance-design"
version = "0.1.0.dev0"
description = "Design of parametric insurance payout functions with tail-risk objectives, per asset or across a portfolio."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Marc Prinzing" }]
requires-python = ">=3.11"
dependencies = [
    "cvxpy>=1.6",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "scipy>=1.15",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/marc272/parametric-insurance-design"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
