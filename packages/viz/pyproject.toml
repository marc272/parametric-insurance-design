[project]
name = "parametric-insurance-design-viz"
version = "0.1.0.dev0"
description = "Figures for parametric-insurance-design, read from its result store."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Marc Prinzing" }]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "parametric-insurance-design",
    "scipy>=1.15.2",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/marc272/parametric-insurance-design"

[tool.uv.sources]
parametric-insurance-design = { workspace = true }

# --- ruff: import boundaries (ADR 0001, AGENTS.md "Hard boundaries") --------
# This [tool.ruff] table makes ruff use this file, which extends the root
# config, for every file under packages/viz/ (src and tests). TID251 bans any
# static import, at any scope, of the packages below.
# scripts/check_import_boundaries.sh proves the bans fire (MAR-76).
[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"parametric_insurance_design_crc".msg = "viz never imports the AGPL CRC adapter (ADR 0001, MAR-76)"
"parametric_insurance_design_climada".msg = "viz never imports the GPL CLIMADA adapter (ADR 0001, MAR-76)"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
