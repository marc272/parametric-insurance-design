name: Site

# The project website (site/, Quarto + OJS, ADR 0003; MAR-201). Pull
# requests that touch the site, or the code and data its bundle is built
# from, build it; a push to main builds it and deploys it to GitHub Pages
# (source "GitHub Actions", the github-pages environment,
# https://marc272.github.io/parametric-insurance-design/).
#
# The site's two bundles (ADR 0003, "Where bundles come from in CI"), each
# solved and exported here on every build from its config (out of sample,
# annual basis) on the committed thesis parity event set:
#   - bundles/explorer/, the explorer bundle, from site/configs/explorer.yaml
#     (the payout explorer);
#   - bundles/portfolio/, the portfolio bundle, from site/configs/portfolio.yaml
#     (the portfolio explorer).
# No download, no cache: the run keys do not include the code version, so a
# cached store could serve results of older code. Each is exported with
# --split test (MAR-213), so it holds the out-of-sample rows only, written
# into the rendered site and checked against its manifest (SHA-256, sizes, no
# other files) and the publication rule (annual basis, out of sample, config
# hash, no failed run, no row of an evaluation split other than "test")
# before the Pages artifact is uploaded.
#
# The committed bundles under site/fixtures/ are test fixtures (in sample),
# checked by packages/viz/tests/test_site_export.py in the CI workflow; they
# are not copied into the site, and the build fails if they are (MAR-210).

# The two path lists are the same: the site, the concept docs the method pages
# include at render time (MAR-166), this workflow, the code, lock and event set
# the bundles are solved and exported from, and the portfolio bundle's check.
on:
  pull_request:
    paths:
      - "site/**"
      - "docs/concepts/**"
      - ".github/workflows/site.yml"
      - "packages/core/src/**"
      - "packages/core/pyproject.toml"
      - "packages/viz/src/**"
      - "packages/viz/pyproject.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "parity/tests/data/thesis_eventset/**"
      - "scripts/check_site_portfolio_bundle.py"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/concepts/**"
      - ".github/workflows/site.yml"
      - "packages/core/src/**"
      - "packages/core/pyproject.toml"
      - "packages/viz/src/**"
      - "packages/viz/pyproject.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "parity/tests/data/thesis_eventset/**"
      - "scripts/check_site_portfolio_bundle.py"
  workflow_dispatch:

permissions:
  contents: read

# PR builds of the same branch cancel each other; deploys on main queue, so a
# deploy is never cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned Quarto CLI. site/_quarto.yml requires the same version
  # (quarto-required); change both together. The build fails early when they
  # differ (step "Check the Quarto pin").
  QUARTO_VERSION: "1.10.19"
  # The explorer bundle, solved and exported in CI from its config: the
  # config, and where the bundle goes in the site.
  EXPLORER_CONFIG: site/configs/explorer.yaml
  EXPLORER_BUNDLE: site/_site/bundles/explorer
  # The portfolio bundle, likewise.
  PORTFOLIO_CONFIG: site/configs/portfolio.yaml
  PORTFOLIO_BUNDLE: site/_site/bundles/portfolio

jobs:
  build:
    name: build (Quarto site)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash # -e -o pipefail: a failing jq in a pipe fails the step
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - name: Sync the workspace
        run: uv sync --locked
      # The Quarto version is pinned twice and Dependabot tracks neither:
      # QUARTO_VERSION (above, what quarto-actions/setup installs) and
      # quarto-required in site/_quarto.yml (what the render requires). Fail
      # before the solve when they differ (MAR-210).
      - name: Check the Quarto pin (QUARTO_VERSION and site/_quarto.yml agree)
        run: |
          uv run --locked python - "$QUARTO_VERSION" site/_quarto.yml <<'PY'
          import sys
          from pathlib import Path

          import yaml

          pinned, path = sys.argv[1], Path(sys.argv[2])
          required = yaml.safe_load(path.read_text(encoding="utf-8")).get("quarto-required")
          if not isinstance(required, str) or required != pinned:
              sys.exit(
                  f"Quarto pin differs: QUARTO_VERSION is {pinned!r} in .github/workflows/site.yml, "
                  f"quarto-required is {required!r} in {path}. Change both together."
              )
          print(f"Quarto pin: {pinned} in .github/workflows/site.yml and {path}")
          PY
      # Every run and sweep point of the config, in 4 worker processes (the
      # runner's vCPUs). A failed run exits 1 and fails the build.
      - name: Solve the explorer runs
        run: |
          start=$SECONDS
          uv run --locked parametric-insurance-design sweep "$EXPLORER_CONFIG" --jobs 4
          echo "solve time: $((SECONDS - start)) s"
      # The portfolio config has no sweeps: its 12 single runs (4 scopes x 3
      # objectives), one after the other. A failed run exits 1 and fails the
      # build.
      - name: Solve the portfolio runs
        run: |
          start=$SECONDS
          uv run --locked parametric-insurance-design run "$PORTFOLIO_CONFIG"
          echo "solve time: $((SECONDS - start)) s"
      # A check only (MAR-233): draw the config's figures from the same store,
      # so a figure that breaks on a holdout config fails the build (MAR-229).
      # They go to the runner's temp directory, outside site/_site, and are
      # neither uploaded nor published. Every sweep was solved above, so there
      # is no --skip-missing-sweeps: any non-zero exit fails the build (1: a
      # figure skipped because a run it needs failed; 3: a run or sweep point
      # missing from the store, or a refused input; 4: a bug). A figure that
      # does not apply (premium reallocation needs a portfolio scope) is listed
      # as "skipped" and exits 0.
      - name: Draw the explorer figures (check only, not published)
        run: |
          start=$SECONDS
          uv run --locked parametric-insurance-design figures "$EXPLORER_CONFIG" --out "$RUNNER_TEMP/explorer-figures"
          echo "figures time: $((SECONDS - start)) s"
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: ${{ env.QUARTO_VERSION }}
      - name: Render the site
        run: quarto render site
      # After the render, which empties site/_site. The label is the config's
      # description. --split test: the KPI, exceedance and map files hold the
      # out-of-sample rows only (MAR-213). A failed run exits 1 and fails the
      # build.
      - name: Export the explorer bundle into the site
        run: uv run --locked parametric-insurance-design export-site "$EXPLORER_CONFIG" --split test --out "$EXPLORER_BUNDLE"
      # The same for the portfolio bundle; it has no sweeps.
      - name: Export the portfolio bundle into the site
        run: uv run --locked parametric-insurance-design export-site "$PORTFOLIO_CONFIG" --no-sweeps --split test --out "$PORTFOLIO_BUNDLE"
      # site/fixtures/ holds test fixtures, in sample: never in the site. Every
      # page links the favicon, so no browser asks for /favicon.ico (a 404).
      - name: Check the rendered pages and the bundles
        run: |
          pages="index.html about.html method/index.html method/tail-risk-objective.html
                 method/portfolio-calibration.html method/combination.html
                 explorers/alpha-beta.html explorers/portfolio.html blog/index.html"
          for f in $pages blog/index.xml favicon.svg \
                   bundles/explorer/manifest.json bundles/explorer/sweep.alpha.payouts.arrow \
                   bundles/portfolio/manifest.json bundles/portfolio/baseline.kpis.arrow; do
            test -s "site/_site/$f" || { echo "missing: site/_site/$f"; exit 1; }
          done
          for f in $pages; do
            grep -qF 'rel="icon"' "site/_site/$f" || { echo "no favicon link: site/_site/$f"; exit 1; }
          done
          test ! -e site/_site/fixtures || { echo "site/_site/fixtures/: test fixtures must not be published"; exit 1; }
          du -sh site/_site "$EXPLORER_BUNDLE" "$PORTFOLIO_BUNDLE"
      # The last step before the upload: what is checked is what is deployed.
      # Each bundle with the config it came from.
      - name: Check the bundles against their manifests and the publication rule
        run: |
          check_bundle() {
          local config=$1 bundle=$2
          local manifest="$bundle/manifest.json"
          echo "==== $bundle (from $config)"
          echo "== checksums"
          (cd "$bundle" && jq -r '.files[] | "\(.sha256 | ltrimstr("sha256:"))  \(.path)"' manifest.json | sha256sum --check --strict)
          echo "== sizes"
          jq -r '.files[] | "\(.bytes) \(.path)"' "$manifest" | while read -r bytes path; do
            actual=$(stat -c %s "$bundle/$path")
            test "$actual" = "$bytes" || { echo "size of $path: $actual, manifest: $bytes"; exit 1; }
          done
          echo "== no files beyond the manifest's"
          diff <(jq -r '.files[].path, "manifest.json"' "$manifest" | sort) <(ls -A "$bundle" | sort)
          echo "== the config it came from"
          hash=$(uv run --locked python -c 'import sys; from parametric_insurance_design.experiment.config import config_hash, load_config; print(config_hash(load_config(sys.argv[1])))' "$config")
          test "$(jq -r '.config.hash' "$manifest")" = "$hash" || { echo "config hash differs from $config ($hash)"; exit 1; }
          echo "== publication rule: annual basis, out of sample, no run left out"
          jq -e '.setup.basis == "annual" and .setup.split.out_of_sample == true and .setup.split.kind != "full" and (.runs.skipped | length) == 0' "$manifest"
          echo "== publication rule: out-of-sample rows only (MAR-213)"
          jq -e '.split_filter.eval_split == "test"' "$manifest"
          # Read every table back: each kpis, exceedance and map file must have
          # an eval_split column holding "test" alone, so no in-sample (train)
          # row is deployed.
          uv run --locked python - "$bundle" <<'PY'
          import json
          import sys
          from pathlib import Path

          import pyarrow as pa

          root = Path(sys.argv[1])
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          split_slices = {"kpis", "exceedance", "map"}
          checked = 0
          for entry in manifest["files"]:
              if entry["format"] != "arrow":
                  continue
              with pa.memory_map(str(root / entry["path"])) as source:
                  table = pa.ipc.open_file(source).read_all()
              if "eval_split" not in table.column_names:
                  if entry["slice"] in split_slices:
                      sys.exit(f"{entry['path']}: no eval_split column")
                  continue
              splits = set(table.column("eval_split").to_pylist())
              if splits != {"test"}:
                  sys.exit(f"{entry['path']}: eval_split {sorted(map(str, splits))}, only 'test' may be published")
              print(f"{entry['path']}: {table.num_rows} rows, eval_split test only")
              checked += 1
          expected = sum(e["slice"] in split_slices for e in manifest["files"])
          if checked == 0 or checked != expected:
              sys.exit(f"checked {checked} tables with eval_split, expected {expected}")
          PY
          jq '{label, config, budget: .budget, split: .setup.split, split_filter: (.split_filter | {eval_split, rows_removed}), files: (.files | length)}' "$manifest"
          }
          check_bundle "$EXPLORER_CONFIG" "$EXPLORER_BUNDLE"
          check_bundle "$PORTFOLIO_CONFIG" "$PORTFOLIO_BUNDLE"
          # Every number the portfolio explorer shows equals the result
          # store's (KPIs and intervals, curves, premiums, per-site cover,
          # clusters), and no joint design has per-site numbers.
          echo "==== $PORTFOLIO_BUNDLE against the result store"
          uv run --locked python scripts/check_site_portfolio_bundle.py "$PORTFOLIO_CONFIG" "$PORTFOLIO_BUNDLE"
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    name: deploy (GitHub Pages)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
