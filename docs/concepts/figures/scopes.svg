<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 385" width="780" height="385" role="img" aria-labelledby="title desc">
<title id="title">Schematic: the individual, portfolio and cluster scopes</title>
<desc id="desc">Individual: one design problem per asset, each with its own budget. Portfolio: one payout function per asset, summed into one design problem with one budget on the aggregate. Cluster: one payout function per cluster on the value-weighted mean index, summed into one design problem with one budget on the aggregate. Schematic, not data.</desc>
<style>
  svg { color: #737d87; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t { fill: currentColor; font-size: 14px; font-weight: 500; }
  .s { fill: currentColor; font-size: 12px; font-weight: 500; }
  .ttl { fill: currentColor; font-size: 15px; font-weight: 700; }
  .note { fill: currentColor; font-size: 12px; font-style: italic; }
  .ln { stroke: currentColor; stroke-width: 1.5; fill: none; }
  .thin { stroke: currentColor; stroke-width: 1; fill: none; }
  .dash { stroke: currentColor; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
  .box { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .acc { stroke: #3b82f6; stroke-width: 2.5; fill: none; }
  .accfill { fill: #3b82f6; fill-opacity: 0.22; stroke: none; }
  .warm { stroke: #d4631c; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
  .warmt { fill: #d4631c; font-size: 13px; }
</style>
