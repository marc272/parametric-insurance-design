<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" role="img" aria-labelledby="title desc">
<title id="title">Schematic: quantile function of the uncovered loss U, with VaR and CVaR at level beta</title>
<desc id="desc">The quantile of U is zero up to the probability P(U = 0), then rises. VaR at beta is the quantile at beta; CVaR at beta is the mean of the quantile over the worst 1 minus beta. Schematic, not data.</desc>
