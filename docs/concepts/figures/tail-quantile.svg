<text class="s" x="502.0" y="268.0" text-anchor="middle">β</text>
<text class="s" x="610.0" y="268.0" text-anchor="middle">1</text>
<text class="t" x="340.0" y="290.0" text-anchor="middle">probability level u (outcomes sorted from no shortfall to the worst)</text>
<text class="t" x="18" y="145.0" text-anchor="middle" transform="rotate(-90 18 145.0)">quantile of the uncovered loss U</text>
<text class="t" x="70.0" y="318.0">If β ≤ P(U = 0): VaR<tspan baseline-shift="sub" font-size="10">β</tspan>(U) = 0, the worst 1 − β holds all of U’s positive mass,</text>
<text class="t" x="70.0" y="338.0">and CVaR<tspan baseline-shift="sub" font-size="10">β</tspan>(U) = E[U] / (1 − β).</text>
