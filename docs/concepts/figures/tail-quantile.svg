<text class="t" x="494.0" y="194.4" text-anchor="end">VaR<tspan baseline-shift="sub" font-size="10">β</tspan>(U)</text>
<text class="warmt" x="508.0" y="130.3" text-anchor="end" dx="-14">CVaR<tspan baseline-shift="sub" font-size="10">β</tspan>(U): mean of the</text>
<text class="warmt" x="508.0" y="146.3" text-anchor="end" dx="-14">curve over the worst 1 − β</text>
<text class="s" x="218.5" y="238.0" text-anchor="middle">atom at 0: no shortfall</text>
<text class="s" x="62.0" y="254.0" text-anchor="end">0</text>
<text class="s" x="70.0" y="268.0" text-anchor="middle">0</text>
