# Install once with: uv run pre-commit install
# Run on everything with: uv run pre-commit run --all-files
# CI runs the same hooks on every pull request.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # Data must never be committed (AGENTS.md). --enforce-all checks every
        # file passed in, so the CI run over all files checks the whole tree.
        args: [--maxkb=500, --enforce-all]
        exclude: ^uv\.lock$
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  # ruff runs from uv.lock, not from a pinned hook repo, so pre-commit and
  # `uv run ruff` can never use different ruff versions (a hook pinned
  # separately can drift from the lock and pass what CI fails). The hooks
  # mirror astral-sh/ruff-pre-commit's; they need uv on PATH, as the rest of
  # the repository does. scripts/check_ruff_single_source.py (CI, job lint)
  # fails if a hook runs ruff any other way.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (uv.lock)
        entry: uv run --locked ruff check --force-exclude
        args: [--fix]
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format (uv.lock)
        entry: uv run --locked ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true

  # Publication rule (AGENTS.md): public files link no private Linear pages.
  # Readers outside the workspace can't open them; write the plain
  # issue ID (MAR-n) instead. Only the agents' working instructions may keep
  # their links (ADR 0004 Q1 = 1A): AGENTS.md, CLAUDE.md, docs/ORCHESTRATION.md,
  # .claude/ and the pull request template.
  - repo: local
    hooks:
      - id: no-linear-urls
        name: no Linear URLs outside the agent files
        language: pygrep
        entry: 'linear\.app'
        types: [text]
        exclude: ^(AGENTS\.md|CLAUDE\.md|docs/ORCHESTRATION\.md|\.github/pull_request_template\.md|\.claude/.*)$
      # docs/README.md links every Markdown page under docs/ directly, and
      # every figure directly or through a page it links, so no page or
      # figure is orphaned from the docs index.
      # --self-test first proves the rules fire on built-in probe trees.
      - id: docs-index
        name: docs/README.md indexes every file under docs/
        language: python
        entry: python scripts/check_docs_index.py --self-test
        files: ^docs/|\.md$|^scripts/check_docs_index\.py$
        pass_filenames: false
