# Install once with: uv run pre-commit install
# Run on everything with: uv run pre-commit run --all-files
# CI runs the same hooks on every pull request.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # Data must never be committed (AGENTS.md). --enforce-all checks every
        # file passed in, so the CI run over all files checks the whole tree.
        args: [--maxkb=500, --enforce-all]
        exclude: ^uv\.lock$
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep equal to the ruff version in uv.lock.
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
